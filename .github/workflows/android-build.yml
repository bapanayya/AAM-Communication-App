name: Build Android APK & Google Play AAB Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Accept Android SDK Licenses and Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Web Application
        run: |
          npm ci || npm install
          cd client
          npm ci || npm install
          npm run build
          cd ..

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK and App Bundle (AAB for Google Play Store)
        run: |
          set -eo pipefail
          cd android
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
            ./gradlew bundleRelease --stacktrace
          else
            gradle assembleDebug --stacktrace
            gradle bundleRelease --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAM-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAM-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Prepare Named Release Assets
        run: |
          set -eo pipefail
          echo "### Build Artifacts Discovery" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find android/app/build -name "*.apk" -o -name "*.aab" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          APK_PATH=$(find android/app/build/outputs/apk -name "*debug.apk" -o -name "*release*.apk" | head -n 1)
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          echo "Selected APK: $APK_PATH" >> $GITHUB_STEP_SUMMARY
          echo "Selected AAB: $AAB_PATH" >> $GITHUB_STEP_SUMMARY

          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" AAM.apk
            cp "$APK_PATH" AUM.apk
            echo "Copied APK to AAM.apk and AUM.apk ($(ls -lh AAM.apk | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
          else
            echo "ERROR: APK not found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
            echo "Signing Release AAB with production upload keystore..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android/app/upload-keystore.jks -storepass aum123 -keypass aum123 "$AAB_PATH" aum
            jarsigner -verify "$AAB_PATH"
            cp "$AAB_PATH" AAM.aab
            cp "$AAB_PATH" AUM.aab
            echo "Copied signed AAB to AAM.aab and AUM.aab ($(ls -lh AAM.aab | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
          else
            echo "ERROR: AAB not found in android/app/build/outputs/bundle/release" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Create or Update GitHub Release with APK and AAB
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.1.1
          name: "AAM — All in One Communication App v1.1.1 (Instant Messaging & New Logo Release)"
          fail_on_unmatched_files: true
          body: |
            ### 🕉️ AAM: All in One Communication App (v1.1.1)
            *Proudly Make in India 🇮🇳 | Target SDK 36 Compliant (Android 14/15/16)*

            #### 🌟 What's New in v1.1.1:
            - **Instant Real-Time Message Delivery**: Fixed false offline detection and eliminates message queuing delays. Direct messages are delivered in milliseconds with real-time double checkmarks.
            - **Global Presence Synchronization**: Accurate live online/offline indicator for all users across devices via WebSocket and periodic heartbeat.
            - **Official AAM App Logo**: Updated brand identity with `AAM-Logo.jpeg` across all Android launcher densities (mdpi through xxxhdpi) and web app icons.
            - **Smooth Bottom Navigation Scrolling**: Fully isolated horizontal gesture scrolling on the bottom navigation bar (`touch-action: pan-x; overscroll-behavior: contain`), eliminating sluggishness and viewport dragging.
            - **Zero Pending Queue Latency**: Removed local queuing for text messages; all conversations sync automatically in real time.
            - **Mandatory Mobile & Email Verification**: 2-step OTP verification gate for secure account registration.

            #### 📦 Downloads:
            - **`AAM.apk`**: Direct installation file for any Android phone (Android 7.0+ / SDK 24–36).
            - **`AAM.aab`**: Official Google Play Store Android App Bundle (signed with production upload keystore).
          files: |
            AAM.apk
            AUM.apk
            AAM.aab
            AUM.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
