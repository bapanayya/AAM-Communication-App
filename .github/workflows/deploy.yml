name: Deploy Web Application to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build Web Client
        run: |
          npm ci || npm install
          cd client
          npm ci || npm install
          npm run build
          cd ..

      - name: Prepare Static Site Artifact
        run: |
          mkdir -p site/downloads
          cp -r client/dist/* site/
          cp privacy-policy.html site/ 2>/dev/null || true
          cp features-and-technology.html site/ 2>/dev/null || true
          cp AAM_Application_Architecture_and_Flow.pdf site/ 2>/dev/null || true
          cp -r assets site/ 2>/dev/null || true
          touch site/.nojekyll
          # Fetch latest release APKs if available
          curl -L -f -s -o site/downloads/AAM.apk https://github.com/bapanayya/AAM-Communication-App/releases/latest/download/AAM.apk || curl -L -f -s -o site/downloads/AAM.apk https://github.com/bapanayya/AUM-Messaging-App/releases/latest/download/AAM.apk || true
          curl -L -f -s -o site/downloads/AUM.apk https://github.com/bapanayya/AAM-Communication-App/releases/latest/download/AUM.apk || curl -L -f -s -o site/downloads/AUM.apk https://github.com/bapanayya/AUM-Messaging-App/releases/latest/download/AUM.apk || true

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

      - name: Upload Pages Artifact (for GitHub Actions Pages source)
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './site'
