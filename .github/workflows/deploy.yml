name: Deploy Web Application to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build Web Client
        run: |
          npm ci || npm install
          cd client
          npm ci || npm install
          npm run build
          cd ..

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare Static Site Artifact
        run: |
          mkdir -p site/downloads
          cp -r client/dist/* site/
          cp privacy-policy.html site/
          cp -r assets site/ 2>/dev/null || true
          touch site/.nojekyll
          # Fetch latest release APK if available
          curl -L -f -s -o site/downloads/AUM.apk https://github.com/bapanayya/AUM-Messaging-App/releases/latest/download/AUM.apk || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
